<h2>Checkout</h2>
<form [formGroup]="formulario">
    <p><input type="text" formControlName="nome" placeholder="Por favor, digite seu nome completo"></p>
    <p><input type="text" formControlName="email" placeholder="Por favor, digite seu email"></p>
    <p><input type="text" formControlName="endereco" placeholder="Por gentileza, Digite seu endereço"></p>
    <button type="button" (click)="finalizar()"> Finalizar a compra do produto</button>
</form>
